<header class="main-header">
  <div class="header-container">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <img src="https://res.cloudinary.com/ddfzttgyr/image/upload/v1787361411/logo_pwrxkp.png" alt="Logo" class="site-logo">
      <span class="logo-text">Tortas Yani</span>
    </a>

    <!-- Navigation Menu -->
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Catálogo</a>
      <a routerLink="/sobre-nosotros" routerLinkActive="active">Sobre Nosotros</a>
      <a routerLink="/ubicanos" routerLinkActive="active">Ubícanos</a>
      <a routerLink="/contactanos" routerLinkActive="active">Contáctanos</a>
      <a routerLink="/chat" routerLinkActive="active">Yani AI (Asistente)</a>
      <a *ngIf="authService.isAdmin()" routerLink="/admin/dashboard" routerLinkActive="active" class="admin-badge-link">Panel Admin</a>
    </nav>

    <!-- Right Side Actions (Cart & User) -->
    <div class="actions">
      <!-- Cart Icon with Badge -->
      <a routerLink="/cart" class="cart-btn" title="Ver Carrito">
        <svg class="cart-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span *ngIf="cartService.totalItems() > 0" class="cart-badge animate-scale">
          {{ cartService.totalItems() }}
        </span>
      </a>

      <!-- User Profile Dropdown -->
      <div class="user-menu" *ngIf="authService.currentUser() as user">
        <div class="user-info">
          <img 
            [src]="getAvatarUrl()" 
            alt="Foto perfil" 
            class="user-avatar"
          />
          <span class="user-name">{{ user.nombre.split(' ')[0] }}</span>
        </div>
        
        <div class="dropdown-menu">
          <div class="dropdown-header">
            <strong>{{ user.nombre }}</strong>
            <span>{{ user.email }}</span>
          </div>
          <hr />
          <a routerLink="/profile" class="dropdown-item">Mi Perfil</a>
          <button (click)="onLogout()" class="dropdown-item logout-btn">
            Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
